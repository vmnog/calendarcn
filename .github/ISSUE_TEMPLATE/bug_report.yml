name: Bug report
description: Something in CalendarCN is broken or behaves unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search [existing issues](https://github.com/vmnog/calendarcn/issues) first to avoid duplicates.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that trigger the bug.
      placeholder: |
        1. Go to the week view
        2. Drag an event to the next day
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - Live demo (https://calendarcn.vercel.app)
        - Running the repo locally
        - Using the component in my own project
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 130 on macOS 15
    validations:
      required: true
  - type: input
    id: timezone
    attributes:
      label: Timezone
      description: CalendarCN renders dates and times in your local timezone, so some bugs only show up in certain timezones or around daylight saving changes.
      placeholder: e.g. America/Sao_Paulo (UTC-3)
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: Drag and drop images or videos here. Drag and resize bugs are much easier to understand with a recording.
    validations:
      required: false
